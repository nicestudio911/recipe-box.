# Fly.io settings for Recipe Box. "fly launch" will ask for a unique app name.
app = "recipe-box"
primary_region = "fra"   # Frankfurt, close to Bulgaria

[build]

[env]
  DATA_DIR = "/data"
  TRUST_PROXY = "1"
  PORT = "3000"

[[mounts]]
  source = "recipe_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"    # sleeps when nobody uses it, to save money
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
