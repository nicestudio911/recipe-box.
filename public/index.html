<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recipe Box</title>
  <meta name="description" content="Your recipes on phone and web. Write them, snap a photo, or import from a link.">
  <meta name="theme-color" content="#c2532d">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar">
    <button id="back" class="icon-btn" aria-label="Back" hidden>‹</button>
    <a href="#/" class="brand"><span>🍲</span> Recipe Box</a>
    <a href="#/settings" id="settings-link" class="icon-btn" aria-label="Account and settings" hidden>⚙︎</a>
  </header>
  <main id="view"></main>
  <button id="fab" aria-label="Add a recipe">+</button>
  <div id="sheet" hidden></div>
  <div id="toast" role="status" hidden></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
